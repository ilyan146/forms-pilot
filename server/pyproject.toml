[project]
name = "forms-pilot"
version = "0.1.0"
description = "API that reads form values from images for the Forms Pilot browser extension."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "openai>=3.46.0",
    "openpyxl>=3.1",
    "pydantic-settings>=2.6",
    "pymupdf>=1.25",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "basedpyright>=1.29",
    "httpx2>=2.16.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forms_pilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
